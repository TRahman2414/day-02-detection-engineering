<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Detection-as-code workflow</title>
  <desc id="desc">Sigma rules move through automated quality checks and convert into Splunk SPL and Elasticsearch Lucene queries. Queries require platform-specific review before deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101f35"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1fc8ff"/><stop offset="1" stop-color="#2774ff"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffcb69"/><stop offset="1" stop-color="#ff9d42"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2l7 4-7 4" fill="none" stroke="#39bfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .label{font:700 15px Inter,system-ui,sans-serif;letter-spacing:2px;fill:#7dd9ff}.head{font:700 24px Inter,system-ui,sans-serif;fill:#f4f8ff}.body{font:500 16px Inter,system-ui,sans-serif;fill:#b6c5d8}.tiny{font:600 13px Inter,system-ui,sans-serif;fill:#92a8c2}.mono{font:500 14px ui-monospace,SFMono-Regular,monospace;fill:#9fe4ff}
    </style>
  </defs>
  <rect width="1500" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="95" r="210" fill="#1b79dc" opacity=".08"/><circle cx="135" cy="660" r="245" fill="#14c8ff" opacity=".045"/>
  <text x="82" y="90" class="label">DETECTION-AS-CODE · PROJECT WORKFLOW</text>
  <text x="82" y="132" class="head" style="font-size:34px">One portable rule set. Two query targets.</text>
  <text x="82" y="164" class="body">Quality checks run before conversion. Generated queries still need environment-specific review.</text>

  <g filter="url(#shadow)">
    <rect x="82" y="240" width="270" height="265" rx="22" fill="#10243a" stroke="#234665"/>
    <rect x="390" y="240" width="335" height="265" rx="22" fill="#10243a" stroke="#1688b6"/>
    <rect x="765" y="240" width="280" height="265" rx="22" fill="#10243a" stroke="#234665"/>
    <rect x="1085" y="203" width="330" height="142" rx="22" fill="#10243a" stroke="#1e79ae"/>
    <rect x="1085" y="400" width="330" height="142" rx="22" fill="#10243a" stroke="#a87534"/>
  </g>
  <path d="M352 372h34" stroke="#39bfff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M725 372h34" stroke="#39bfff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1045 328h26" stroke="#39bfff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1045 420c15 0 18 51 26 51" fill="none" stroke="#39bfff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(108 272)">
    <rect width="48" height="48" rx="14" fill="#103750"/><path d="M14 15h20M14 23h14M14 31h19" stroke="#66d9ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="82" class="label">01 · AUTHOR</text><text x="0" y="117" class="head">Sigma rules</text>
    <text x="0" y="151" class="body">10 detections</text><text x="0" y="179" class="body">Windows + Linux</text>
    <text x="0" y="221" class="mono">rules/**/*.yml</text>
  </g>
  <g transform="translate(418 272)">
    <rect width="48" height="48" rx="14" fill="#103750"/><path d="m13 25 8 8 16-19" fill="none" stroke="#54dbbd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="82" class="label">02 · VERIFY</text><text x="0" y="117" class="head">Automated quality gates</text>
    <text x="0" y="151" class="body">YAML + schema · UUID + metadata</text><text x="0" y="179" class="body">ATT&amp;CK tags · pytest · Sigma CLI</text>
    <rect x="0" y="202" width="265" height="34" rx="17" fill="#123c3b"/><circle cx="18" cy="219" r="5" fill="#54dbbd"/><text x="32" y="224" class="tiny" fill="#9cebd8">GitHub Actions on push / pull request</text>
  </g>
  <g transform="translate(793 272)">
    <rect width="48" height="48" rx="14" fill="#103750"/><path d="M14 16h21M14 24h21M14 32h21" stroke="#66d9ff" stroke-width="2.5" stroke-linecap="round"/><circle cx="18" cy="16" r="2" fill="#071426"/>
    <text x="0" y="82" class="label">03 · CONVERT</text><text x="0" y="117" class="head">Sigma CLI</text>
    <text x="0" y="151" class="body">Backend-specific translation</text><text x="0" y="179" class="body">Separate converter scripts</text>
    <text x="0" y="221" class="mono">scripts/convert_*.sh</text>
  </g>
  <g transform="translate(1114 229)">
    <rect width="42" height="42" rx="12" fill="#103750"/><path d="M12 13h18v16H12zM16 18h10M16 23h7" fill="none" stroke="#66d9ff" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="18" class="label">04A · OUTPUT</text><text x="0" y="80" class="head">Splunk SPL</text><text x="0" y="109" class="body">Generated query files</text><text x="0" y="132" class="mono">output/splunk/</text>
  </g>
  <g transform="translate(1114 426)">
    <rect width="42" height="42" rx="12" fill="#3b2d20"/><circle cx="21" cy="21" r="11" fill="none" stroke="#ffc36b" stroke-width="2"/><path d="M10 21h22M21 10c5 6 5 16 0 22M21 10c-5 6-5 16 0 22" fill="none" stroke="#ffc36b" stroke-width="1.5"/>
    <text x="58" y="18" class="label" style="fill:#ffc36b">04B · OUTPUT</text><text x="0" y="80" class="head">Elasticsearch Lucene</text><text x="0" y="109" class="body">Query strings, not Query DSL</text><text x="0" y="132" class="mono" style="fill:#ffd28e">output/elastic/</text>
  </g>
  <rect x="82" y="604" width="1333" height="88" rx="18" fill="#0b192a" stroke="#253b52"/>
  <circle cx="116" cy="648" r="9" fill="url(#amber)"/><text x="141" y="641" class="label" style="fill:#ffc36b">OPERATOR STEP</text>
  <text x="141" y="669" class="body">Review field mappings, thresholds, and false positives in your telemetry before deployment. No live SIEM testing is included.</text>
</svg>
