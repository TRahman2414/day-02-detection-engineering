<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">How detection-as-code supports business security operations</title>
<desc id="desc">Business and technology telemetry feeds a shared Sigma rule library, which is checked in CI and translated into Splunk SPL and Elasticsearch Lucene. Analysts review alerts and tune them using telemetry requirements and false-positive guidance.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#12243b"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#40dbff"/><stop offset="1" stop-color="#3884ff"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd278"/><stop offset="1" stop-color="#ff9b4e"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".24"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#41caff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
 .eyebrow{font:700 15px Inter,system-ui,sans-serif;letter-spacing:2px;fill:#7edcff}.title{font:700 36px Inter,system-ui,sans-serif;fill:#f4f8ff}.sub{font:500 18px Inter,system-ui,sans-serif;fill:#aebfd2}.cardtitle{font:700 22px Inter,system-ui,sans-serif;fill:#f4f8ff}.body{font:500 16px Inter,system-ui,sans-serif;fill:#b3c4d9}.small{font:600 14px Inter,system-ui,sans-serif;fill:#8ea7c2}.tag{font:700 13px Inter,system-ui,sans-serif;letter-spacing:1px;fill:#76dcff}.mono{font:500 14px ui-monospace,SFMono-Regular,monospace;fill:#a4e6ff}
 </style>
</defs>
<rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
<circle cx="1450" cy="100" r="250" fill="#2479d2" opacity=".07"/><circle cx="40" cy="940" r="260" fill="#19bfe9" opacity=".04"/>
<text x="84" y="80" class="eyebrow">BUSINESS APPLICATION · DETECTION ENGINEERING</text>
<text x="84" y="130" class="title">A reusable security workflow for business teams</text>
<text x="84" y="166" class="sub">Keep detections reviewable, validate changes automatically, then adapt the queries to the tools already in use.</text>

<!-- telemetry sources -->
<g filter="url(#shadow)"><rect x="84" y="220" width="270" height="326" rx="22" fill="#10243a" stroke="#244461"/>
<rect x="390" y="220" width="280" height="326" rx="22" fill="#10243a" stroke="#207fa9"/>
<rect x="706" y="220" width="300" height="326" rx="22" fill="#10243a" stroke="#198eaa"/>
<rect x="1042" y="202" width="474" height="156" rx="22" fill="#10243a" stroke="#217cad"/>
<rect x="1042" y="387" width="474" height="156" rx="22" fill="#10243a" stroke="#97723f"/></g>
<path d="M354 384h30" stroke="#41caff" stroke-width="3" marker-end="url(#arr)"/>
<path d="M670 384h30" stroke="#41caff" stroke-width="3" marker-end="url(#arr)"/>
<path d="M1006 384h24" stroke="#41caff" stroke-width="3" marker-end="url(#arr)"/>
<path d="M1018 384c17 0 17-105 23-105" fill="none" stroke="#41caff" stroke-width="3" marker-end="url(#arr)"/>
<path d="M1018 384c17 0 17 81 23 81" fill="none" stroke="#41caff" stroke-width="3" marker-end="url(#arr)"/>

<!-- source card -->
<g transform="translate(112 250)">
 <rect width="48" height="48" rx="14" fill="#103750"/><path d="M12 34V19l12-8 12 8v15M18 34V24h12v10" fill="none" stroke="#6cddff" stroke-width="2.5" stroke-linejoin="round"/>
 <text x="0" y="82" class="tag">01 · BUSINESS TELEMETRY</text><text x="0" y="118" class="cardtitle">Signals from everyday work</text>
 <circle cx="8" cy="157" r="4" fill="#51d3fc"/><text x="24" y="162" class="body">Employee endpoints + servers</text>
 <circle cx="8" cy="190" r="4" fill="#51d3fc"/><text x="24" y="195" class="body">Identity and sign-in activity</text>
 <circle cx="8" cy="223" r="4" fill="#51d3fc"/><text x="24" y="228" class="body">Cloud and business applications</text>
 <text x="0" y="273" class="small">Different sectors, shared patterns</text>
</g>
<!-- shared rule library -->
<g transform="translate(418 250)">
 <rect width="48" height="48" rx="14" fill="#103750"/><path d="M15 11h18a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3zM18 19h14M18 25h14M18 31h9" fill="none" stroke="#6cddff" stroke-width="2.2" stroke-linecap="round"/>
 <text x="0" y="82" class="tag">02 · AUTHOR ONCE</text><text x="0" y="118" class="cardtitle">Shared Sigma library</text>
 <text x="0" y="158" class="body">Portable rule definitions keep</text><text x="0" y="183" class="body">detection logic together for review.</text>
 <rect x="0" y="211" width="226" height="40" rx="11" fill="#0b1b2d" stroke="#1d4968"/><text x="16" y="237" class="mono">rules/windows + linux</text>
 <text x="0" y="286" class="small">ATT&amp;CK tags · rationale · false positives</text>
</g>
<!-- checks card -->
<g transform="translate(734 250)">
 <rect width="48" height="48" rx="14" fill="#103750"/><path d="m12 25 8 8 17-19" fill="none" stroke="#62dfbe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="0" y="82" class="tag">03 · CHECK EACH CHANGE</text><text x="0" y="118" class="cardtitle">Automated quality gate</text>
 <text x="0" y="158" class="body">Tests, rule metadata, mappings,</text><text x="0" y="183" class="body">and Sigma syntax are checked in CI.</text>
 <rect x="0" y="211" width="248" height="40" rx="11" fill="#103a38"/><circle cx="18" cy="231" r="5" fill="#62dfbe"/><text x="32" y="236" class="small" style="fill:#acebd8">Review failures before merge</text>
 <text x="0" y="286" class="small">GitHub Actions runs on push / pull request</text>
</g>
<!-- outputs -->
<g transform="translate(1072 227)">
 <rect width="44" height="44" rx="12" fill="#103750"/><path d="M12 13h20M12 20h20M12 27h13" stroke="#6cddff" stroke-width="2.2" stroke-linecap="round"/>
 <text x="62" y="17" class="tag">04A · IF THE TEAM USES SPLUNK</text><text x="0" y="78" class="cardtitle">Generate Splunk SPL</text><text x="0" y="111" class="body">Start from the same portable Sigma source.</text><text x="0" y="137" class="mono">output/splunk/</text>
</g>
<g transform="translate(1072 412)">
 <rect width="44" height="44" rx="12" fill="#3b2d20"/><circle cx="22" cy="22" r="12" fill="none" stroke="#ffc66f" stroke-width="2"/><path d="M10 22h24M22 10c5 6 5 18 0 24M22 10c-5 6-5 18 0 24" fill="none" stroke="#ffc66f" stroke-width="1.5"/>
 <text x="62" y="17" class="tag" style="fill:#ffc66f">04B · IF THE TEAM USES ELASTICSEARCH</text><text x="0" y="78" class="cardtitle">Generate Lucene queries</text><text x="0" y="111" class="body">Avoid hand-translating every rule from scratch.</text><text x="0" y="137" class="mono" style="fill:#ffd28e">output/elastic/</text>
</g>

<!-- value strip -->
<text x="84" y="619" class="eyebrow">WHAT THIS CAN HELP TEAMS DO</text>
<g filter="url(#shadow)">
 <rect x="84" y="646" width="336" height="202" rx="20" fill="#0e2034" stroke="#23445f"/>
 <rect x="444" y="646" width="336" height="202" rx="20" fill="#0e2034" stroke="#23445f"/>
 <rect x="804" y="646" width="336" height="202" rx="20" fill="#0e2034" stroke="#23445f"/>
 <rect x="1164" y="646" width="352" height="202" rx="20" fill="#0e2034" stroke="#23445f"/>
</g>
<g transform="translate(112 676)"><circle cx="14" cy="14" r="14" fill="#123e55"/><path d="M8 14h12M14 8v12" stroke="#73dcff" stroke-width="2"/><text x="42" y="21" class="cardtitle" style="font-size:19px">Consistency</text><text x="0" y="70" class="body">Keep rule logic and review</text><text x="0" y="95" class="body">history in one shared place.</text><text x="0" y="151" class="small">Useful across teams and sites</text></g>
<g transform="translate(472 676)"><circle cx="14" cy="14" r="14" fill="#123e55"/><path d="m8 14 4 4 8-9" fill="none" stroke="#62dfbe" stroke-width="2.5" stroke-linecap="round"/><text x="42" y="21" class="cardtitle" style="font-size:19px">Change confidence</text><text x="0" y="70" class="body">Catch common format and</text><text x="0" y="95" class="body">metadata issues before merge.</text><text x="0" y="151" class="small">A repeatable quality gate</text></g>
<g transform="translate(832 676)"><circle cx="14" cy="14" r="14" fill="#123e55"/><path d="M8 14h12M16 10l4 4-4 4" fill="none" stroke="#73dcff" stroke-width="2"/><text x="42" y="21" class="cardtitle" style="font-size:19px">Less duplicate work</text><text x="0" y="70" class="body">Translate a shared source into</text><text x="0" y="95" class="body">more than one supported SIEM.</text><text x="0" y="151" class="small">Splunk + Elasticsearch outputs</text></g>
<g transform="translate(1192 676)"><circle cx="14" cy="14" r="14" fill="#3b2d20"/><path d="M14 7v8l5 3" fill="none" stroke="#ffc66f" stroke-width="2.5" stroke-linecap="round"/><text x="42" y="21" class="cardtitle" style="font-size:19px">Analyst context</text><text x="0" y="70" class="body">Document telemetry needs and</text><text x="0" y="95" class="body">false-positive considerations.</text><text x="0" y="151" class="small">Supports tuning and investigation</text></g>

<rect x="84" y="886" width="1432" height="70" rx="16" fill="#0a192a" stroke="#344355"/>
<circle cx="116" cy="921" r="7" fill="url(#orange)"/><text x="140" y="915" class="tag" style="fill:#ffc66f">PRACTICAL LIMIT</text>
<text x="140" y="940" class="small">This portfolio generates and validates query examples. A company still needs to map its fields, tune thresholds, and test against its own logs before deployment.</text>
</svg>
