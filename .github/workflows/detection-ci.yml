name: Detection Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detection-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install project and Sigma backends
        run: python -m pip install -e ".[sigma]"

      - name: Run pytest
        run: pytest -v

      - name: Run rule validation
        run: python scripts/validate_rules.py

      - name: Run metadata validation
        run: python scripts/check_metadata.py

      - name: Run ATT&CK validation
        run: python scripts/check_attack_tags.py

      - name: Validate Sigma rules and ATT&CK tags
        run: sigma check --exclude attacktag --fail-on-issues rules/

      - name: Convert rules to Splunk SPL
        run: bash scripts/convert_splunk.sh

      - name: Convert rules to Elasticsearch Lucene queries
        run: bash scripts/convert_elastic.sh
