title: Suspicious Encoded PowerShell Execution
id: 2758d0df-4347-4719-8bb9-8d8288fb0d9e
status: experimental
description: Detects PowerShell command lines containing encoded payloads or encoded command switches that are commonly used to obfuscate malicious activity.
author: Day 02 Detection Engineering Project
date: 2026-10-06
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - ' -encodedcommand '
      - ' -enc '
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
  condition: selection
falsepositives:
  - Legitimate administrative scripts that use encoded commands for automation.
  - Configuration management tools such as SCCM or Intune.
  - Security products that launch encoded PowerShell for approved scans.
level: high
